name: Go CI

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+' # Push events to matching v*, i.e. v20.15.10
  pull_request:
    branches:
      - '**'

# A run is superseded only on a pull request. On main (and on tag pushes) the
# group is unique per ref and commit, so no run is ever cancelled: the main run
# cuts the version tag (strongo/cicd go_bump) and must complete for every
# merge. The literal `true` below only ever applies to pull_request groups,
# which are keyed by pull request number.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: true

jobs:

  strongo_workflow:
    permissions:
      contents: write
    uses: strongo/cicd/.github/workflows/workflow.yml@main

    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
    with:
      require_conventional_pr_title: true
      code_coverage: true
      min_test_coverage_percent: 100
